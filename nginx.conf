# Cloudflare Tunnel → cloudflared → nginx(이 파일) 구조
#  /      → Vue 정적 파일
#  /api/  → Spring Boot backend:8888

# WebSocket 을 쓰는 요청에만 Connection: upgrade 를 붙입니다.
# (모든 요청에 무조건 붙이면 일부 프록시/백엔드에서 문제가 됩니다)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare 가 붙여주는 원래 프로토콜(https)을 그대로 전달합니다.
# nginx 는 cloudflared 로부터 http 로 받으므로 $scheme 을 쓰면 항상 http 가 됩니다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # 업로드/요청 본문 크기 (nginx 기본값 1MB → 413 오류 방지)
    # 참고: Cloudflare 무료 플랜은 100MB 가 상한이라 그 이상은 의미 없습니다.
    client_max_body_size 50m;

    # Gzip 압축 활성화 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 정적 파일 루트 경로
    root /usr/share/nginx/html;
    index index.html;

    # 컨테이너 헬스체크용
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 백엔드 API 리버스 프록시
    # 프론트와 같은 오리진이므로 CORS 설정이 필요 없습니다.
    location /api/ {
        proxy_pass http://backend:8888/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # 아티팩트 조회/엑셀 생성처럼 오래 걸리는 요청 대비
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 정적 파일 캐싱 (JS, CSS, 이미지, 폰트 등)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA 라우팅 지원 (Vue Router HTML5 History Mode)
    # index.html 은 캐시하지 않아야 재배포 후 옛 화면이 남지 않습니다.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # 에러 페이지 처리
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
