server {
    listen 80;
    server_name localhost;

    # Gzip 압축 활성화 (성능 최적화)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 정적 파일 루트 경로
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 지원 (Vue Router HTML5 History Mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐싱 (JS, CSS, 이미지, 폰트 등)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 백엔드 API 리버스 프록시 (Docker Compose 환경 및 Cloudflare 연동 지원)
    # 프론트엔드와 백엔드가 docker compose 네트워크(예: 서비스명 backend:8888)에 함께 묶일 때 사용됩니다.
    location /api/ {
        proxy_pass http://backend:8888/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Cloudflare 및 클라이언트 원 IP / 프로토콜 전달 헤더
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 에러 페이지 처리
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
